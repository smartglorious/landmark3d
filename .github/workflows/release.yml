name: Release

# Push a tag "vX.Y.Z" that matches the version in pyproject.toml:
#   git tag v0.2.0 && git push origin v0.2.0
# The workflow tests the tag, then publishes a GitHub Release with:
#   landmark3d-X.Y.Z.zip   full app folder with the 3D viewer files included (unzip, run install.cmd / install.sh)
#   *.whl / *.tar.gz       Python package (pip install landmark3d-X.Y.Z-py3-none-any.whl)
#   SHA256SUMS.txt
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match pyproject version
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "v$VER" ] || { echo "tag $TAG does not match pyproject version $VER"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Install and test
        run: |
          python -m pip install -c requirements.lock -e ".[dev]" build
          LANDMARK3D_HOME="$RUNNER_TEMP/l3d_home" python -m pytest -q
      - name: Vendor the viewer files
        run: python -c "from landmark3d import installer; import sys; sys.exit(0 if installer.fetch_three() else 1)"
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Build the app zip
        run: |
          V=${{ steps.ver.outputs.version }}
          P=landmark3d-$V
          git archive --format=zip --prefix="$P/" -o "dist/$P.zip" HEAD
          mkdir -p "stage/$P/landmark3d/web"
          cp -r landmark3d/web/vendor "stage/$P/landmark3d/web/"
          (cd stage && zip -qr "../dist/$P.zip" "$P")
          unzip -l "dist/$P.zip" | grep -q "$P/landmark3d/web/vendor/three/build/three.module.js"
          unzip -l "dist/$P.zip" | grep -q "$P/install.cmd"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.ver.outputs.tag }}
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Landmark3D $TAG" --generate-notes --verify-tag
          fi
