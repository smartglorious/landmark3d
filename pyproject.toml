[project]
name = "landmark3d"
version = "0.2.0"
description = "Landmark name + location -> researched data pack -> gated Blender build -> validated GLB, with a local web app for approvals."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "pillow>=10",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
landmark3d = "landmark3d.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["landmark3d*"]

[tool.setuptools.package-data]
landmark3d = ["web/*", "web/vendor/**/*", "schemas/*.json"]
